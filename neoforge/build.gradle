plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'idea'
}

// 探针只有开发类目录，没有 jar 任务；生产构建始终只发布 main。
sourceSets {
    probe {
        java.srcDir rootProject.file('common/src/dev/java')
        resources.srcDir rootProject.file('common/src/dev/resources')
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations.probeImplementation.extendsFrom(configurations.implementation)
configurations.probeCompileOnly.extendsFrom(configurations.compileOnly)

neoForge {
    version = neoforge_version
    addModdingDependenciesTo(sourceSets.probe)
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            systemProperty 'forge.logging.console.level', 'debug'
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        probeServer {
            server()
            sourceSet = sourceSets.probe
            gameDirectory = file(providers.gradleProperty('probeRunDir').getOrElse('build/probe-run'))
            programArgument '--nogui'
            systemProperty 'idtw.probe.suite', providers.gradleProperty('probeSuite').getOrElse('core')
            systemProperty 'idtw.probe.negative', providers.gradleProperty('probeNegative').getOrElse('false')
            systemProperty 'idtw.probe.phase', providers.gradleProperty('probePhase').getOrElse('prepare')
            systemProperty 'idtw.probe.runId', providers.gradleProperty('probeRunId').getOrElse('manual')
        }
        gameTestServer {
            type = "gameTestServer"
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.probe
        }
    }
}

// build 同时编译开发工具，尽早发现接缝变化；发布物仍取 main.output。
tasks.named('check') { dependsOn tasks.named('probeClasses') }

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
