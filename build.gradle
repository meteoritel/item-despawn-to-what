plugins {
    // see https://fabricmc.net/develop/ for new versions
    id 'fabric-loom' version '1.8-SNAPSHOT' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.49-beta' apply false
}

// 发布边界检查使用已经生成的各端产物，开发源集只参与编译检查。
tasks.register('checkProbePackaging', Exec) {
    dependsOn ':common:assemble', ':fabric:assemble', ':neoforge:assemble'
    commandLine 'python', rootProject.file('tools/check-probe-packaging.py')
}
['generateConfigReference': false, 'checkConfigReference': true].each { taskName, checkOnly ->
    tasks.register(taskName, Exec) {
        group = checkOnly ? 'verification' : 'documentation'
        dependsOn ':common:exportConfigReference'
        workingDir rootProject.projectDir
        commandLine 'python', rootProject.file('tools/gen-config-reference.py')
        if (checkOnly) args '--check'
    }
}
subprojects {
    plugins.withId('java') {
        tasks.named('check') { dependsOn rootProject.tasks.named('checkProbePackaging') }
    }
}
