plugins {
    // see https://fabricmc.net/develop/ for new versions
    id 'fabric-loom' version '1.8-SNAPSHOT' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.49-beta' apply false
}

// 发布边界检查使用已经生成的各端产物，开发源集只参与编译检查。
tasks.register('checkProbePackaging', Exec) {
    dependsOn ':common:assemble', ':fabric:assemble', ':neoforge:assemble'
    commandLine 'python', rootProject.file('tools/check-probe-packaging.py')
}
// 全仓检查由根任务持有；多个子项目的 check 只引用同一个任务图节点。
['checkIsolation': 'check-isolation.py', 'checkDocs': 'check-docs.py',
 'checkI18n': 'check-i18n.py'].each { taskName, script ->
    tasks.register(taskName, Exec) {
        group = 'verification'
        workingDir rootProject.projectDir
        commandLine 'python', rootProject.file("tools/${script}")
    }
}
tasks.register('checkUiKitBoundaries', Exec) {
    group = 'verification'
    workingDir rootProject.projectDir
    def shell = System.getProperty('os.name').toLowerCase().contains('windows') ? 'powershell' : 'pwsh'
    commandLine shell, '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File',
            rootProject.file('tools/check-ui-kit-boundaries.ps1')
}
['generateConfigReference': false, 'checkConfigReference': true].each { taskName, checkOnly ->
    tasks.register(taskName, Exec) {
        group = checkOnly ? 'verification' : 'documentation'
        dependsOn ':common:exportConfigReference'
        workingDir rootProject.projectDir
        commandLine 'python', rootProject.file('tools/gen-config-reference.py')
        if (checkOnly) args '--check'
    }
}
tasks.register('checkRepository') {
    group = 'verification'
    description = '校验依赖隔离、文档、语言、UI kit 与配置参考的一致性。'
    dependsOn 'checkIsolation', 'checkDocs', 'checkI18n', 'checkUiKitBoundaries', 'checkConfigReference'
}
subprojects {
    plugins.withId('java') {
        tasks.named('check') {
            dependsOn rootProject.tasks.named('checkProbePackaging'), rootProject.tasks.named('checkRepository')
        }
    }
}
