name: Repository checks

on:
  pull_request:
    branches: ['1.21.1']
  push:
    branches: ['1.21.1']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Check PowerShell runtime
        run: pwsh -NoProfile -Command '$PSVersionTable.PSVersion'
      - name: Build and verify repository
        run: |
          chmod +x ./gradlew
          ./gradlew build
