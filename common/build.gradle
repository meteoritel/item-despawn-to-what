plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

// 配置参考工具单独编译，既不扩展模组源集，也不进入发布 jar。
def configDocsClasses = layout.buildDirectory.dir('config-docs/classes')
tasks.register('compileConfigDocs', JavaCompile) {
    dependsOn tasks.named('classes')
    source rootProject.fileTree('tools/config-docs') { include '*.java' }
    classpath = sourceSets.main.runtimeClasspath
    destinationDirectory = configDocsClasses
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
    options.encoding = 'UTF-8'
}
tasks.register('exportConfigReference', JavaExec) {
    dependsOn tasks.named('compileConfigDocs')
    workingDir layout.buildDirectory.get().asFile
    classpath = files(configDocsClasses) + sourceSets.main.runtimeClasspath
    mainClass = 'com.meteorite.itemdespawntowhat.core.config.ConfigReferenceExporter'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    def output = rootProject.layout.buildDirectory.file('config-docs/schema.json')
    args output.get().asFile.absolutePath
    inputs.files(sourceSets.main.runtimeClasspath, configDocsClasses)
    outputs.file(output)
}

tasks.register('verifyConfigMigrations', JavaExec) {
    group = 'verification'
    description = '离线核对已发布 JSON 版本语义与实际文件迁移提交。'
    dependsOn tasks.named('compileConfigDocs')
    classpath = files(configDocsClasses) + sourceSets.main.runtimeClasspath
    mainClass = 'com.meteorite.itemdespawntowhat.core.config.MigrationVerification'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}
tasks.named('check') { dependsOn tasks.named('verifyConfigMigrations') }

// 同一份开发样板只与 kit 源码、MC 及许可依赖编译，产品 main 产物不进入 classpath。
tasks.register('compileUiKitSamples', JavaCompile) {
    group = 'verification'
    description = '独立编译 UI kit 与纯样板，拦截对产品实现的隐式依赖。'
    source fileTree('src/main/java/com/meteorite/itemdespawntowhat/client/ui/kit') { include '**/*.java' }
    source fileTree('src/dev/java/com/meteorite/itemdespawntowhat/client/debug/kit') { include '**/*.java' }
    classpath = sourceSets.main.compileClasspath.minus(sourceSets.main.output)
    destinationDirectory = layout.buildDirectory.dir('ui-kit-samples/classes')
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
    options.encoding = 'UTF-8'
}
tasks.named('check') { dependsOn tasks.named('compileUiKitSamples') }

def interfaceToolClasses = layout.buildDirectory.dir('ui-kit-interface/classes')
tasks.register('compileUiKitInterfaceTool', JavaCompile) {
    source rootProject.fileTree('tools/ui-kit-interface') { include '*.java' }
    classpath = files()
    destinationDirectory = interfaceToolClasses
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
    options.encoding = 'UTF-8'
}
tasks.register('exportUiKitInterface', JavaExec) {
    group = 'verification'
    description = '使用 JDK 语言模型核对 kit 嵌套、继承与 protected 有效公开面。'
    dependsOn tasks.named('compileUiKitInterfaceTool')
    classpath = files(interfaceToolClasses) + sourceSets.main.compileClasspath.minus(sourceSets.main.output)
    mainClass = 'ExportInterface'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    args file('src/main/java/com/meteorite/itemdespawntowhat/client/ui/kit').absolutePath,
            rootProject.file(providers.gradleProperty('kitInterfaceOutput').getOrElse('tools/ui-kit-interface/api.txt')).absolutePath,
            providers.gradleProperty('kitInterfaceMode').getOrElse('check'),
            rootProject.file('tools/ui-kit-interface/dependencies.txt').absolutePath,
            mod_id
}
tasks.named('check') { dependsOn tasks.named('exportUiKitInterface') }
